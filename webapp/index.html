<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vaelorn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1 id="greeting">Vaelorn</h1>
      <p id="subtitle" class="muted">Loading…</p>
    </header>

    <section class="stats">
      <div class="stat"><span id="total-users">–</span><small>total users</small></div>
      <div class="stat"><span id="active-today">–</span><small>active today</small></div>
      <div class="stat"><span id="my-visits">–</span><small>your visits</small></div>
    </section>

    <section class="card">
      <label for="note">Your note</label>
      <textarea id="note" maxlength="500" rows="4" placeholder="Saved to your profile…" disabled></textarea>
      <button id="save" disabled>Save</button>
      <p id="status" class="muted"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
